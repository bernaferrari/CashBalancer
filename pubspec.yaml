name: cash_balancer
description: Balance cash between multiple wallets.
publish_to: 'none'
version: 2.0.0+3

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  animations: ^3.0.0
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  google_fonts: ^9.0.0
  intl: ^0.20.3
  drift: ^2.35.4
  path_provider: ^2.1.6
  path: ^1.9.1
  rxdart: ^0.28.0
  material_ui: ^1.11.0
  cupertino_ui: ^1.0.0
  flutter_multi_formatter: ^2.13.11
  shared_preferences: ^2.5.6
  rx_shared_preferences: ^4.0.0
  fl_chart: ^1.3.1
  beamer: ^1.7.0

dev_dependencies:
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
